# Data provenance notes:
# - Step A times: from duration_ms in tape last entry (reliable for all 4 runs)
# - Step B times: from duration_ms in tape last entry (reliable for all 4 xhigh runs)
# - Step C times: from original experiment records (duration_ms unreliable — some agents show 0.0)
# - Step D times: re-derived from first/last world event timestamps; means exclude violating runs
# - Step C time 50.0 for run 173917: from original records, not re-derived
# - Turn counts: from tape JSONL line counts (agent-1 + agent-2), reliable across all conditions
# - Resets: from world/state/state.json "resets" field, reliable across all conditions
# - Coordination classification: none (no scripts), unilateral (one agent used), bilateral (both agents used)
# - Turn counts: from tape JSONL line counts (agent-1 + agent-2), reliable across all conditions
# - Resets: from world/state/state.json "resets" field, reliable across all conditions
