# Pre-registry pilot registry for runnable model experiments.
#
# Use the same entry schema as tests/model/evaluations.toml, but keep only
# experiments that are runnable enough for pilot iteration and not yet ready for
# the active acceptance catalog.
#
# Path convention:
#   pilot-<level>-<mode>/<feature>/<variant>
#
# Example:
# [[evaluation]]
# id = "exec-final-utility-stream-handoff"
# level = "l4"
# mode = "discovery"
# feature = "exec"
# variant = "final-utility-stream-handoff"
# path = "pilot-l4-discovery/exec/final-utility-stream-handoff"
# acceptance = "pilot"
# env_profile = "mac-kimi"
# linux_only = false
# title = "Exec Discovery Pilot: Final Utility Stream Handoff"
# summary = "pre-registry discovery pilot"
# question = "Without naming exec, does the task pressure lead the model toward process-image replacement?"

[[evaluation]]
id = "exec-final-utility-stream-handoff"
level = "l4"
mode = "discovery"
feature = "exec"
variant = "final-utility-stream-handoff"
path = "pilot-l4-discovery/exec/final-utility-stream-handoff"
acceptance = "pilot"
env_profile = "mac-kimi"
linux_only = false
title = "Exec Discovery Pilot: Final Utility Stream Handoff"
summary = "pre-registry discovery pilot for stream ownership transfer"
question = "Without naming exec, does one-shot stream pressure lead the model to direct process replacement?"

