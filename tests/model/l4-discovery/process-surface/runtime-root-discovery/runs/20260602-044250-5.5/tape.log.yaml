        - Under `overlay`, interactive jobs run in a job-local workspace lineage; after exit, `workspace_session`, `fs_mutations` when enabled, `world_revision`, and `world_handle` appear in the job directory for optional `switch_world` adoption.
        - Use ordinary POSIX signals against the recorded pid/process group for terminal process control, for example `kill -INT -$(cat <job>/pid)`.

        - `stdin`: provides verbatim multi-line input without shell heredoc or quoting mechanics.

        **fork** - Spawn child agents for parallel exploration, delegation, or decomposition.
        - `fork` does not consume execution budget, but it is still bounded by depth, agent slots, and shared inference concurrency.
        - Use `fork` when independent hypotheses, decoders, implementations, extractors, or verification strategies can be tried in parallel.
        - If 2-3 plausible approaches exist and no contract-shaped artifact or service is stable yet, fork 2-3 labeled children now instead of spending another long exploratory `sh` in the parent.
        - Fork children preserve the parent mission as the active task contract; each child intent is a lane assignment, not a replacement mission.
        - Child intents should include lane-specific inputs only when they are not already in the parent mission or current visible context.
        - Do one cheap shared setup/probe if all lanes need it; then fork specialized heavyweight installs, downloads, transcription, OCR, builds, searches, or long-running probes. Do not make every child repeat the same setup.
        - Use `mode="race"` when any one child can produce an acceptable artifact/service; use `mode="wait"` when child findings must be compared or merged.
        - Child intents should name a distinct strategy, the expected artifact/service when known, and the closest success check.
        - After race/wait returns, converge immediately: adopt an available winning world or merge/copy the best child result before continuing parent-side exploration.
        - Each child is another you under a different intent.
        - Each child starts from your current visible context surface rather than reconstructing cognition from retained trace files.
        - `fork` returns a retained relation handle plus each child's process handles.
        - Member process handles include `session_id`, `agent_root`, `public_root`, `retained_root`, `seed_root`, `status_path`, and `control_path`; child filesystem effects follow the configured workspace/world lineage; stdout/stderr are only captured process output.
        - With workspace physics enabled, returning fork results also report parent-side `fs_mutations` and `world_revision`; under subjective children these are normally empty or unchanged because child writes stay in child lineage.
        - `race` (default): first child to exit 0 wins, rest are killed.
        - `wait`: block until all finish, return all results.
        - `forget`: fire-and-forget, return immediately.
        - `mode="wait"`: block until all children finish and return every result.
        - Each child is another you under a different intent.
        - `fork` returns a retained relation handle (`relation_id`, `relation_root`, `relation_handle`) plus each member's ordinary process handles (`session_id`, `agent_root`, `public_root`, `retained_root`, `seed_root`, `status_path`, `control_path`), exit code, and captured stdout/stderr process output.
        - Adoptable subjective child results expose a `world://<workspace-session>/<revision>` handle you can pass to `switch_world`.
        - With workspace physics enabled, returning fork results also report parent-side `fs_mutations` and `world_revision`; under subjective children these are normally empty or unchanged because child writes stay in child lineage.
        - `mode="race"`: first successful child wins and the remaining children are stopped; `adopt_winner=true` switches the parent into a winning adoptable child world.
        - `mode="forget"`: return after spawning children without waiting for child completion.
        - Children inherit your current filesystem view.
        - Children and parent share the same filesystem surface.

        **exec** - Replace the current process image with a new executable.
        - You may optionally provide `target` and explicit `argv` to exec into a different binary.
        - Default behavior uses quine's configured self-reentry target as `target` and `argv=[that target, current mission]`.
        - In the ordinary quine entry form, the process is started as `argv=[<Quine Binary>, <mission>]`.
        - The replacement process inherits the current process stdin/stdout/stderr positions and exec environment base; other still-open descriptors follow ordinary exec fd inheritance.
        - Default `exec()` uses quine's configured self-reentry target. If that target is a replaceable filesystem path whose file has changed, default `exec()` runs the file currently on disk there.
