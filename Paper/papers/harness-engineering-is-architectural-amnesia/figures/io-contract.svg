<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <!-- Black background for 5:2 ratio -->
  <rect x="0" y="0" width="500" height="200" fill="#0d0d0d"/>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Core layout centered -->
  <g transform="translate(90, 25)">
    
    <!-- Parent Process (top) -->
    <rect x="110" y="0" width="100" height="28" fill="#1a1a1a" stroke="#555" stroke-width="1" rx="2"/>
    <text x="160" y="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#ccc">Parent Process</text>
    <text x="160" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#666">(POSIX / Quine)</text>
    
    <!-- argv arrow -->
    <path d="M 160 28 L 160 55" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
    <text x="175" y="45" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#aaa">argv</text>
    <text x="175" y="53" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#666">(Mission)</text>
    
    <!-- Upstream -->
    <rect x="0" y="65" width="70" height="40" fill="#1a1a1a" stroke="#444" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
    <text x="35" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#888">Upstream</text>
    <text x="35" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#555">POSIX / Quine / ∅</text>
    
    <!-- stdin arrow -->
    <path d="M 70 85 L 105 85" stroke="#666" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arrow-dashed)"/>
    <text x="88" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#777">stdin</text>
    <text x="88" y="96" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#555">(Material)</text>
    
    <!-- Core Quine Process -->
    <rect x="110" y="60" width="100" height="50" fill="#252525" stroke="#888" stroke-width="1.5" rx="2"/>
    <text x="160" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">Quine Process</text>
    <line x1="125" y1="86" x2="195" y2="86" stroke="#444" stroke-width="0.5"/>
    <text x="160" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#888">PID: assigned / isolated</text>
    
    <!-- Downstream -->
    <rect x="250" y="65" width="70" height="40" fill="#1a1a1a" stroke="#444" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
    <text x="285" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#888">Downstream</text>
    <text x="285" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#555">POSIX / Quine / ∅</text>
    
    <!-- stdout arrow -->
    <path d="M 210 85 L 245 85" stroke="#666" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arrow-dashed)"/>
    <text x="228" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#777">stdout</text>
    <text x="228" y="96" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#555">(Deliverables)</text>
    
    <!-- stderr arrow (down-left) -->
    <path d="M 145 110 L 145 140" stroke="#666" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arrow-dashed)"/>
    <text x="125" y="128" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#777">stderr</text>
    <text x="125" y="137" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#555">(Diagnostics)</text>
    
    <!-- exit arrow (down-right) -->
    <path d="M 175 110 L 175 140" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
    <text x="195" y="128" font-family="Helvetica, Arial, sans-serif" font-size="6" fill="#aaa">exit</text>
    <text x="195" y="137" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#666">(Judgment)</text>
    
    <!-- Parent Process (bottom, optional listener) -->
    <rect x="110" y="145" width="100" height="28" fill="#1a1a1a" stroke="#444" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
    <text x="160" y="157" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#888">Parent Process</text>
    <text x="160" y="167" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="5" fill="#555">(may or may not listen)</text>
  </g>
</svg>
