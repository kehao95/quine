<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380">
  <!-- Title -->
  <text x="480" y="25" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#000">Lifecycle Primitives</text>
  
  <!-- Legend -->
  <rect x="200" y="45" width="12" height="12" fill="#333" stroke="#000"/>
  <text x="218" y="55" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000">Mission (argv)</text>
  <rect x="320" y="45" width="12" height="12" fill="#888" stroke="#000"/>
  <text x="338" y="55" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000">Scoped State (env)</text>
  <rect x="440" y="45" width="12" height="12" fill="#ccc" stroke="#000"/>
  <text x="458" y="55" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000">Ephemeral (Context)</text>
  <rect x="600" y="45" width="12" height="12" fill="#fff" stroke="#000"/>
  <text x="618" y="55" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#000">Empty / Reset</text>
  <rect x="720" y="45" width="12" height="12" fill="#fff" stroke="#000" stroke-dasharray="3,2"/>
  <text x="738" y="55" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666">Terminated</text>
  
  <!-- ==================== FORK (Parallelism) ==================== -->
  <text x="160" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000">fork() — Spawn</text>
  <text x="160" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666">Create child process(es)</text>
  
  <!-- Parent process -->
  <g transform="translate(110, 115)">
    <rect x="0" y="0" width="100" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="50" y="-5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Parent (PID 1)</text>
    <!-- Mission bar -->
    <rect x="5" y="5" width="90" height="14" fill="#333" stroke="#000"/>
    <text x="50" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#fff">argv: "coordinate"</text>
    <!-- Scoped State bar -->
    <rect x="5" y="22" width="90" height="14" fill="#888" stroke="#000"/>
    <text x="50" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#fff">env: STATE_*</text>
    <!-- Ephemeral State bar -->
    <rect x="5" y="39" width="90" height="16" fill="#ccc" stroke="#000"/>
    <text x="50" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#000">Context (ephemeral)</text>
  </g>
  
  <!-- Arrows to children -->
  <line x1="160" y1="180" x2="80" y2="220" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="160" y1="180" x2="160" y2="220" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="160" y1="180" x2="240" y2="220" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="180" y="200" font-family="Helvetica, Arial, sans-serif" font-size="9" font-style="italic" fill="#666">fork()</text>
  
  <!-- Child 1 -->
  <g transform="translate(40, 230)">
    <rect x="0" y="0" width="70" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="35" y="-5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#000">PID 2</text>
    <rect x="4" y="4" width="62" height="11" fill="#333" stroke="#000"/>
    <text x="35" y="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#fff">"task A"</text>
    <rect x="4" y="17" width="62" height="11" fill="#888" stroke="#000"/>
    <text x="35" y="25" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#fff">STATE_* ✓</text>
    <rect x="4" y="30" width="62" height="12" fill="#fff" stroke="#000" stroke-dasharray="3,2"/>
    <text x="35" y="39" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#666">∅</text>
  </g>
  
  <!-- Child 2 -->
  <g transform="translate(125, 230)">
    <rect x="0" y="0" width="70" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="35" y="-5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#000">PID 3</text>
    <rect x="4" y="4" width="62" height="11" fill="#333" stroke="#000"/>
    <text x="35" y="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#fff">"task B"</text>
    <rect x="4" y="17" width="62" height="11" fill="#888" stroke="#000"/>
    <text x="35" y="25" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#fff">STATE_* ✓</text>
    <rect x="4" y="30" width="62" height="12" fill="#fff" stroke="#000" stroke-dasharray="3,2"/>
    <text x="35" y="39" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#666">∅</text>
  </g>
  
  <!-- Child 3 -->
  <g transform="translate(210, 230)">
    <rect x="0" y="0" width="70" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="35" y="-5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#000">PID 4</text>
    <rect x="4" y="4" width="62" height="11" fill="#333" stroke="#000"/>
    <text x="35" y="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#fff">"task C"</text>
    <rect x="4" y="17" width="62" height="11" fill="#888" stroke="#000"/>
    <text x="35" y="25" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#fff">STATE_* ✓</text>
    <rect x="4" y="30" width="62" height="12" fill="#fff" stroke="#000" stroke-dasharray="3,2"/>
    <text x="35" y="39" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#666">∅</text>
  </g>
  
  <!-- Fork summary -->
  <text x="160" y="305" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">New PID, New mission (argv)</text>
  <text x="160" y="317" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Scoped state inherited, Ephemeral reset</text>
  
  <!-- ==================== EXEC (Context Reset) ==================== -->
  <text x="480" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000">exec() — Continue</text>
  <text x="480" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666">Replace image, preserve process continuity</text>
  
  <!-- Before state -->
  <g transform="translate(430, 115)">
    <rect x="0" y="0" width="100" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="50" y="-5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Before (PID 1)</text>
    <rect x="5" y="5" width="90" height="14" fill="#333" stroke="#000"/>
    <text x="50" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#fff">argv: "search doc"</text>
    <rect x="5" y="22" width="90" height="14" fill="#888" stroke="#000"/>
    <text x="50" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#fff">MATCH_COUNT=1</text>
    <rect x="5" y="39" width="90" height="16" fill="#ccc" stroke="#000"/>
    <text x="50" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#000">Context (saturated)</text>
  </g>
  
  <!-- Arrow for self-transformation -->
  <path d="M 480 180 L 480 210" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="510" y="200" font-family="Helvetica, Arial, sans-serif" font-size="9" font-style="italic" fill="#666">exec()</text>
  
  <!-- After state -->
  <g transform="translate(430, 225)">
    <rect x="0" y="0" width="100" height="55" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="50" y="-5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">After (PID 1) ← same</text>
    <rect x="5" y="4" width="90" height="12" fill="#333" stroke="#000"/>
    <text x="50" y="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#fff">argv reused by default</text>
    <rect x="5" y="18" width="90" height="12" fill="#888" stroke="#000"/>
    <text x="50" y="27" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#fff">MATCH_COUNT=2 ↑</text>
    <rect x="5" y="32" width="90" height="14" fill="#fff" stroke="#000" stroke-dasharray="3,2"/>
    <text x="50" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#666">Context (fresh)</text>
  </g>
  
  <!-- Exec summary -->
  <text x="480" y="305" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#333">Same PID; argv reused in default self re-entry</text>
  <text x="480" y="317" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Scoped state persists, Ephemeral reset</text>
  
  <!-- ==================== EXIT (Terminate) ==================== -->
  <text x="800" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000">exit() — Terminate</text>
  <text x="800" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666">Signal outcome to parent</text>
  
  <!-- Child process before exit -->
  <g transform="translate(750, 115)">
    <rect x="0" y="0" width="100" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="50" y="-5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#000">Child (PID 2)</text>
    <rect x="5" y="5" width="90" height="14" fill="#333" stroke="#000"/>
    <text x="50" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#fff">argv: "task A"</text>
    <rect x="5" y="22" width="90" height="14" fill="#888" stroke="#000"/>
    <text x="50" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#fff">env: RESULT=...</text>
    <rect x="5" y="39" width="90" height="16" fill="#ccc" stroke="#000"/>
    <text x="50" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#000">Context (done)</text>
  </g>
  
  <!-- Arrow for exit -->
  <path d="M 800 180 L 800 210" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="830" y="200" font-family="Helvetica, Arial, sans-serif" font-size="9" font-style="italic" fill="#666">exit(status)</text>
  
  <!-- Terminated process (dashed, faded - resources reclaimed) -->
  <g transform="translate(750, 225)">
    <rect x="0" y="0" width="100" height="55" fill="#fafafa" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="50" y="-5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#999">(terminated)</text>
    <line x1="15" y1="10" x2="85" y2="45" stroke="#ccc" stroke-width="1"/>
    <line x1="85" y1="10" x2="15" y2="45" stroke="#ccc" stroke-width="1"/>
    <text x="50" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#999">reclaimed</text>
  </g>
  
  <!-- Exit code annotation -->
  <g transform="translate(870, 235)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#333">status:</text>
    <text x="0" y="15" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">0 = success</text>
    <text x="0" y="28" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">&gt;0 = failure</text>
  </g>
  
  <!-- Exit summary -->
  <text x="800" y="305" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Process terminates</text>
  <text x="800" y="317" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#333">Resources reclaimed by OS</text>
  
  <!-- Divider lines -->
  <line x1="320" y1="70" x2="320" y2="340" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="640" y1="70" x2="640" y2="340" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Bottom comparison -->
  <text x="480" y="355" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666">✓ = preserved | ↑ = updated | ∅ = empty/fresh | dashed = reset/terminated</text>
</svg>
