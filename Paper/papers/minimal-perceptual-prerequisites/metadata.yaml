abstract: |
  Can LLM agents coordinate when given no explicit indication that other agents exist or that cooperation is required? We show that they can, and identify a threshold distinguishing coordination that closes from coordination that stalls. In a shared-scarcity task, two LLM agents face a collection problem objectively requiring coordination under a global budget, but this requirement is not disclosed. We enforce \emph{existential unawareness}---no explicit peer/cooperation framing in prompts, tool results, or telemetry---and progressively remove passive perception channels across four conditions (N=20). Framed as an existence proof in a single substrate, task, and model configuration, our results are twofold: (1) existential unawareness is experimentally isolatable, with coordination succeeding whenever at least one quantitative environmental signal remains (12/12); (2) we observe a threshold between anomaly-detection and artifact-detection---quantitative signals (budget depletion patterns) support task closure, while qualitative signals (static files) support peer-detection but not stable cooperation (0/8 legitimate closure). In one run, agents completed the task while holding incompatible causal models, suggesting macro-level coordination does not require aligned representations.
