<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- ==================== LEFT: Negotiation ==================== -->
  
  <!-- Left section title -->
  <text x="175" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold">Stigmergic Negotiation</text>
  
  <!-- Dividing line -->
  <line x1="360" y1="45" x2="360" y2="320" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Time axis for left section -->
  <line x1="40" y1="60" x2="340" y2="60" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="9" fill="#666">t₀</text>
  <text x="150" y="55" font-family="Arial, sans-serif" font-size="9" fill="#666">t₁</text>
  <text x="240" y="55" font-family="Arial, sans-serif" font-size="9" fill="#666">t₂</text>
  <text x="320" y="55" font-family="Arial, sans-serif" font-size="9" fill="#666">t₃</text>
  
  <!-- Agent rows with proposals -->
  
  <!-- Agent 76634: 2-way -->
  <g transform="translate(0, 85)">
    <rect x="15" y="-12" width="45" height="24" fill="white" stroke="black" stroke-width="1"/>
    <text x="37" y="5" text-anchor="middle" font-family="monospace" font-size="9">76634</text>
    
    <!-- Proposal bubble -->
    <ellipse cx="100" cy="0" rx="30" ry="14" fill="white" stroke="black" stroke-width="1"/>
    <text x="100" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">2-way</text>
    
    <!-- Arrow to consensus -->
    <path d="M 130 0 Q 200 0 280 70" fill="none" stroke="black" stroke-width="1" stroke-dasharray="3,2"/>
  </g>
  
  <!-- Agent 76658: 3-way → 4-way -->
  <g transform="translate(0, 130)">
    <rect x="15" y="-12" width="45" height="24" fill="white" stroke="black" stroke-width="1"/>
    <text x="37" y="5" text-anchor="middle" font-family="monospace" font-size="9">76658</text>
    
    <!-- Initial proposal -->
    <ellipse cx="100" cy="0" rx="30" ry="14" fill="white" stroke="black" stroke-width="1"/>
    <text x="100" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">3-way</text>
    
    <!-- Update arrow -->
    <line x1="130" y1="0" x2="165" y2="0" stroke="black" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <!-- Updated proposal -->
    <ellipse cx="200" cy="0" rx="30" ry="14" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="200" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">4-way</text>
    <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666" font-style="italic">updates</text>
    
    <!-- Arrow to consensus -->
    <path d="M 230 0 L 280 25" fill="none" stroke="black" stroke-width="1"/>
  </g>
  
  <!-- Agent 76566: 4-way (origin) -->
  <g transform="translate(0, 175)">
    <rect x="15" y="-12" width="45" height="24" fill="white" stroke="black" stroke-width="1"/>
    <text x="37" y="5" text-anchor="middle" font-family="monospace" font-size="9">76566</text>
    
    <!-- Proposal bubble (origin of consensus) -->
    <ellipse cx="100" cy="0" rx="30" ry="14" fill="white" stroke="black" stroke-width="2"/>
    <text x="100" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">4-way</text>
    
    <!-- Direct arrow to consensus -->
    <line x1="130" y1="0" x2="280" y2="-20" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="195" y="-15" font-family="Arial, sans-serif" font-size="8" fill="#666" font-style="italic">adopted</text>
  </g>
  
  <!-- Agent 76540: ghost -->
  <g transform="translate(0, 220)">
    <rect x="15" y="-12" width="45" height="24" fill="white" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="37" y="5" text-anchor="middle" font-family="monospace" font-size="9" fill="#999">76540</text>
    
    <!-- Ghost indicator -->
    <text x="100" y="5" font-family="Arial, sans-serif" font-size="9" fill="#999" font-style="italic">(registered but silent)</text>
  </g>
  
  <!-- Consensus box -->
  <rect x="270" y="145" width="70" height="35" fill="white" stroke="black" stroke-width="2"/>
  <text x="305" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="bold">Consensus</text>
  <text x="305" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">4-way split</text>
  
  <!-- Left side annotation -->
  <text x="175" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#444">Heterogeneous proposals (different world-models)</text>
  <text x="175" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#444">→ convergence proves interaction, not sampling variance</text>
  
  <!-- ==================== RIGHT: Homeostasis ==================== -->
  
  <!-- Right section title -->
  <text x="540" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold">Homeostasis</text>
  
  <!-- Phase 1: Normal -->
  <g transform="translate(380, 60)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Phase 1: Registration</text>
    <!-- Phantom agent - registered but never acted -->
    <rect x="0" y="10" width="50" height="35" fill="white" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="25" y="25" text-anchor="middle" font-family="monospace" font-size="8" fill="#999">76540</text>
    <text x="25" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#999">00-02</text>
    
    <rect x="55" y="10" width="50" height="35" fill="white" stroke="black" stroke-width="1"/>
    <text x="80" y="25" text-anchor="middle" font-family="monospace" font-size="8">76566</text>
    <text x="80" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">03-05</text>
    
    <rect x="110" y="10" width="50" height="35" fill="white" stroke="black" stroke-width="1"/>
    <text x="135" y="25" text-anchor="middle" font-family="monospace" font-size="8">76634</text>
    <text x="135" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">06-08</text>
    
    <rect x="165" y="10" width="50" height="35" fill="white" stroke="black" stroke-width="1"/>
    <text x="190" y="25" text-anchor="middle" font-family="monospace" font-size="8">76658</text>
    <text x="190" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">09</text>
  </g>
  
  <!-- Arrow down -->
  <line x1="540" y1="115" x2="540" y2="135" stroke="black" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Phase 2: Anomaly Detection -->
  <g transform="translate(380, 145)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Phase 2: Anomaly Detected</text>
    
    <!-- Dead agent -->
    <rect x="0" y="10" width="50" height="35" fill="white" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="25" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">✗</text>
    
    <!-- Living agents with checkmarks -->
    <rect x="55" y="10" width="50" height="35" fill="white" stroke="black" stroke-width="1"/>
    <text x="80" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">✓</text>
    
    <rect x="110" y="10" width="50" height="35" fill="white" stroke="black" stroke-width="1"/>
    <text x="135" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">✓</text>
    
    <rect x="165" y="10" width="50" height="35" fill="white" stroke="black" stroke-width="1"/>
    <text x="190" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">✓</text>
    
    <!-- Detection quote -->
    <text x="110" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666" font-style="italic">"Still waiting for 76540..."</text>
  </g>
  
  <!-- Arrow down -->
  <line x1="540" y1="210" x2="540" y2="230" stroke="black" stroke-width="1" marker-end="url(#arrowhead)"/>
  
  <!-- Phase 3: Compensation -->
  <g transform="translate(380, 240)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Phase 3: Proceed Without</text>
    
    <!-- Phantom agent - never acted -->
    <rect x="0" y="10" width="50" height="35" fill="white" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="25" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">✗</text>
    
    <!-- Living agents -->
    <rect x="55" y="10" width="50" height="35" fill="white" stroke="black" stroke-width="1"/>
    <text x="80" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">✓</text>
    
    <rect x="110" y="10" width="50" height="35" fill="white" stroke="black" stroke-width="1"/>
    <text x="135" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">✓</text>
    
    <rect x="165" y="10" width="50" height="35" fill="white" stroke="black" stroke-width="1"/>
    <text x="190" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">✓</text>
  </g>
  
  <!-- Final consensus -->
  <g transform="translate(380, 295)">
    <rect x="55" y="0" width="160" height="22" fill="white" stroke="black" stroke-width="2"/>
    <text x="135" y="15" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-weight="bold">CONSENSUS</text>
    <text x="135" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">3/4 reporting, 70% verified</text>
  </g>
  
  <!-- Right side annotation -->
  <text x="540" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#444">Colony maintains operational boundary despite cell death</text>
</svg>
